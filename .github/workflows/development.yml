name: Publish development build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.info.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Allocate this run's development version
        id: info
        run: |
          python3 scripts/release_info.py "$(cat VERSION)" \
            --development-build "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Show allocated version
        env:
          BUILD_VERSION: ${{ steps.info.outputs.version }}
        run: |
          printf '### `%s`\n\nCommit: `%s`\n' "$BUILD_VERSION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      development: true
